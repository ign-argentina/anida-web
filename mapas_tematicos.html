<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WSV8Q7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <header id="header"></header>

  <script>
    fetch('/components/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });
  </script>

  <main>
    <div id="menusup_titlezone" class="jumbotron text-center">
      <h2>Mapas</h2>
    </div>

    <section class="content-section">
      <div class="container">
        <!-- Introducción -->
        <div class="section-intro">
          <p>A través de palabras clave podés buscar, visualizar y descargar los mapas que colecciona el atlas.</p>
        </div>

        <!-- Buscador -->
        <div class="search-container">
          <form id="search-form" class="search-form">
            <div class="input-group mb-3">
              <input type="text" id="keyword-input" class="form-control" placeholder="Buscar por palabra clave..." aria-label="Buscar mapas">
              <button id="clear-keyword-btn" type="button" class="btn btn-secondary" title="Limpiar búsqueda" style="display:none">
                <i class='bx bx-x-circle'></i>
              </button>
              <button class="keyword-input-btn" type="submit">
                <i class='bx bx-search'></i> Buscar
              </button>
            </div>

            <!-- Filtros rápidos (categorías) -->

            <div class="quick-filters">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-todos" value="Todos" checked>
                <label class="form-check-label" for="cat-todos">Todos</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-mundo" value="Argentina y el mundo">
                <label class="form-check-label" for="cat-mundo">Argentina y el mundo</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-fisico" value="Argentina físico-natural">
                <label class="form-check-label" for="cat-fisico">Argentina físico-natural</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-socio" value="Argentina socio-demográfica">
                <label class="form-check-label" for="cat-socio">Argentina socio-demográfica</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-econ" value="Argentina económica">
                <label class="form-check-label" for="cat-econ">Argentina económica</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-amb" value="Argentina ambiental">
                <label class="form-check-label" for="cat-amb">Argentina ambiental</label>
              </div>
            </div>

            <div class="accordion mt-3" id="advanced-search-accordion">
              <div class="accordion-item">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAdvanced" aria-expanded="false" aria-controls="collapseAdvanced">
                    <i class='bx bx-filter-alt me-2'></i> Búsqueda avanzada
                  </button>
                </h2>
                <div id="collapseAdvanced" class="accordion-collapse collapse" data-bs-parent="#advanced-search-accordion">
                  <div class="accordion-body">
                    <p class="text-muted mb-3">Filtrar por múltiples criterios. Seleccione una o más opciones en cada categoría.</p>

                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <h5 class="filter-title">Escala espacial</h5>
                        <div class="filter-group">
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-1" value="Global">
                            <label class="form-check-label" for="espacial-1">Global</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-2" value="Regional o subnacional">
                            <label class="form-check-label" for="espacial-2">Regional o subnacional</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-3" value="País Bicontinental">
                            <label class="form-check-label" for="espacial-3">País Bicontinental</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-4" value="País Parte Continental Americana">
                            <label class="form-check-label" for="espacial-4">País Parte Continental Americana</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-5" value="País Antártida e Islas del Atlántico Sur">
                            <label class="form-check-label" for="espacial-5">País Antártida e Islas del Atlántico Sur</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-6" value="País Islas Malvinas">
                            <label class="form-check-label" for="espacial-6">País Islas Malvinas</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-7" value="País por departamento">
                            <label class="form-check-label" for="espacial-7">País por departamento</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-8" value="País por provincia">
                            <label class="form-check-label" for="espacial-8">País por provincia</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaEspacial" id="espacial-9" value="País por área">
                            <label class="form-check-label" for="espacial-9">País por área</label>
                          </div>
                        </div>
                      </div>

                      <div class="col-md-6 mb-3">
                        <h5 class="filter-title">Escala temporal</h5>
                        <div class="filter-group">
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaTemporal" id="temporal-1" value="Años censales">
                            <label class="form-check-label" for="temporal-1">Años censales</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaTemporal" id="temporal-2" value="Periodos">
                            <label class="form-check-label" for="temporal-2">Periodos</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="escalaTemporal" id="temporal-3" value="Siglos">
                            <label class="form-check-label" for="temporal-3">Siglos</label>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="d-flex justify-content-end mt-3">
                      <button type="button" id="clear-advanced-btn" class="btn btn-outline-secondary me-2">Limpiar filtros avanzados</button>
                      <button type="button" id="apply-advanced-btn" class="btn btn-primary">Aplicar filtros</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </form>
        </div>

        <!-- Filtros activos -->
        <div class="active-filters-container mt-3">
          <div id="active-filters" class="active-filters"></div>
          <button id="clear-filters-btn" class="btn btn-sm btn-outline-secondary">Limpiar todos</button>
        </div>

        <!-- Resultados -->
        <div class="results-container mt-4">
          <div class="results-header">
            <h3 id="results-count">0 resultados</h3>
          </div>

          <!-- Grid de miniaturas -->
          <div id="results-grid" class="flex-container"></div>

          <!-- Botón "Cargar más" -->
          <div class="d-flex justify-content-center mt-4 mb-5">
            <button id="load-more-btn" class="btn">Cargar más</button>
          </div>
        </div>
      </div>
    </section>
