<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WSV8Q7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <header id="header"></header>

  <script>
    fetch('/components/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });
  </script>

  <main>
    <div id="menusup_titlezone" class="jumbotron text-center">
      <h2>Mapas temáticos</h2>
    </div>

    <section class="content-section">
      <div class="container">
        <!-- Introducción -->
        <div class="section-intro">
          <p>Explora nuestra colección de mapas temáticos, visualiza y descarga mapas sobre Argentina y el mundo.</p>
        </div>

        <!-- Buscador -->
        <div class="search-container">
          <form id="search-form" class="search-form">
            <div class="input-group mb-3">
              <input type="text" id="keyword-input" class="form-control" placeholder="Buscar por palabra clave..." aria-label="Buscar mapas">
              <button class="btn btn-primary" type="submit">
                <i class='bx bx-search'></i> Buscar
              </button>
            </div>
            
            <!-- Filtros rápidos (categorías) -->
            <div class="quick-filters">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-todos" value="Todos" checked>
                <label class="form-check-label" for="cat-todos">Todos</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-mundo" value="Argentina y el mundo">
                <label class="form-check-label" for="cat-mundo">Argentina y el mundo</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-fisico" value="Argentina físico-natural">
                <label class="form-check-label" for="cat-fisico">Argentina físico-natural</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-socio" value="Argentina socio-demográfica">
                <label class="form-check-label" for="cat-socio">Argentina socio-demográfica</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-econ" value="Argentina económica">
                <label class="form-check-label" for="cat-econ">Argentina económica</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="category" id="cat-amb" value="Argentina ambiental">
                <label class="form-check-label" for="cat-amb">Argentina ambiental</label>
              </div>
            </div>
          </form>
        </div>

        <!-- Filtros activos -->
        <div class="active-filters-container mt-3">
          <div id="active-filters" class="active-filters"></div>
          <button id="clear-filters-btn" class="btn btn-sm btn-outline-secondary">Limpiar todos</button>
        </div>

        <!-- Resultados -->
        <div class="results-container mt-4">
          <div class="results-header">
            <h3 id="results-count">0 resultados</h3>
          </div>
          
          <!-- Grid de miniaturas -->
          <div id="results-grid" class="grid-miniaturas"></div>
          
          <!-- Botón "Cargar más" -->
          <div class="text-center mt-4 mb-5">
            <button id="load-more-btn" class="btn btn-outline-primary">Cargar más</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script>
    fetch('/components/footer.html')
      .then(response => response.text())
